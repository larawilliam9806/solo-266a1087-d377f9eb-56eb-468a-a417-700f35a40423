version: "3.8"

services:
  extractor:
    build: .
    image: layer-directory-extractor:latest
    container_name: layer-directory-extractor
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      DATA_DIR: /data
      PORT: "8000"
    volumes:
      - extractor-data:/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s

volumes:
  extractor-data:
    name: layer-directory-extractor-data
